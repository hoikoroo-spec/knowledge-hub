<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151a2b"><meta name="description" content="会話とメモを育てる個人ナレッジアプリ"><link rel="manifest" href="manifest.webmanifest"><title>Knowledge Hub</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:dark;background:#101522;color:#e9edf7}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}.shell{display:grid;grid-template-columns:300px 1fr;min-height:100dvh}.side{background:#171d2e;border-right:1px solid #30384d;padding:18px;display:flex;flex-direction:column;gap:13px}.brand{font-size:22px;font-weight:800}.brandlink{border:0;background:transparent;color:inherit;font:inherit;font-weight:800;text-align:left;padding:0;cursor:pointer}.brandlink:hover{color:#a9b6ff}.homebrand{font-size:17px;white-space:nowrap;margin-right:auto}.notionbox{border:1px solid #465678;border-radius:14px;padding:15px;background:#202b42;display:grid;gap:10px}.notionbox a{color:#c5d0ff}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#354564;color:white;padding:12px 18px;border-radius:12px;z-index:20;max-width:90vw}.muted{color:#a7b0c5;font-size:13px}.actions{display:flex;gap:8px}.btn{border:1px solid #3d4962;background:#252f47;color:#fff;padding:10px 13px;border-radius:12px}.btn.primary{background:#596ef2;border-color:#596ef2}.btn.ghost{background:transparent}.btn.danger{color:#ffb1b1}.btn:hover{filter:brightness(1.15)}input,textarea,select{background:#11192a;border:1px solid #3d4962;color:#fff;border-radius:10px;padding:11px;width:100%}textarea{resize:vertical;min-height:120px}.items{overflow:auto;flex:1}.item{display:block;text-align:left;width:100%;border:1px solid transparent;background:transparent;color:#e9edf7;border-radius:12px;padding:12px;margin:3px 0}.item:hover,.item.active{background:#28324a;border-color:#44516c}.item strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item small{display:block;color:#a7b0c5;margin-top:5px}.main{min-width:0;display:flex;flex-direction:column;max-height:100dvh}.top{padding:16px 24px;border-bottom:1px solid #30384d;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.content{flex:1;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:16px}.empty{margin:auto;text-align:center;max-width:480px}.empty h1{font-size:32px}.messages{display:flex;flex-direction:column;gap:12px}.bubble{max-width:80%;border-radius:16px;padding:13px 16px;white-space:pre-wrap;overflow-wrap:anywhere;background:#26334c}.bubble.me{align-self:flex-end;background:#3849a3}.bubble .stamp{font-size:11px;color:#c4cce1;margin-top:7px}.compose{border-top:1px solid #30384d;padding:15px 24px;display:flex;gap:10px;align-items:end}.compose textarea{min-height:56px;max-height:170px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.grow{flex:1}.panel{border:1px solid #35415b;border-radius:15px;padding:16px;background:#1b2438}.panel h3{margin:0 0 12px}.draft{display:grid;gap:12px}.tag{font-size:12px;border:1px solid #4c5b78;padding:4px 8px;border-radius:999px;color:#c9d1e3}.notice{font-size:12px;color:#a7b0c5}.mobile-only{display:none}@media(max-width:760px){.shell{display:block}.side{position:fixed;z-index:5;inset:0 20% 0 0;box-shadow:10px 0 60px #0009;transform:translateX(-110%);transition:transform .2s}.side.open{transform:translateX(0)}.main{height:100dvh}.mobile-only{display:inline-block}.top,.content,.compose{padding:12px}.bubble{max-width:94%}.empty h1{font-size:25px}} </style></head><body>
<div class="shell"><aside id="side" class="side"><div class="brand"><button class="brandlink" id="sideHome">✦ Knowledge Hub</button></div><div class="muted">思いつきを、未来の知識に。</div><div class="actions"><button class="btn primary grow" id="newChat">＋ 会話</button><button class="btn grow" id="newMemo">＋ メモ</button></div><input id="search" placeholder="会話・メモを検索" aria-label="検索"><div class="row"><select id="filter" aria-label="表示フィルター"><option value="all">すべて</option><option value="chat">会話</option><option value="memo">メモ</option><option value="candidate">登録候補</option></select></div><div id="items" class="items"></div><div class="row"><button class="btn ghost" id="export">バックアップ</button><button class="btn ghost" id="import">読み込み</button><input type="file" id="file" accept="application/json" hidden></div><div class="notice">この版は端末内保存です。AI応答・同期・Notion自動登録は未接続。Notionへのコピー転送は利用可能。機密情報は入力しないでください。</div></aside><main class="main"><header class="top"><button class="btn mobile-only" id="menu" aria-label="メニュー">☰</button><button class="brandlink homebrand" id="home">✦ Knowledge Hub</button><input id="title" class="grow" placeholder="タイトル" style="max-width:520px" disabled><span id="status" class="tag">未選択</span><button class="btn ghost" id="remove" disabled>削除</button></header><section class="content" id="content"><div class="empty"><h1>思いつきを残そう</h1><p class="muted">「＋ 会話」「＋ メモ」から始められます。会話は自分の発言を記録する方式です。</p><div class="row" style="justify-content:center"><button class="btn primary" id="startChat">会話を始める</button><button class="btn" id="startMemo">メモを作る</button></div></div></section><footer id="footer" class="compose" hidden><textarea id="message" placeholder="ここに自由に入力… (Ctrl+Enterで保存)"></textarea><button class="btn primary" id="send">発言を保存</button></footer></main></div>
<script>
(()=>{'use strict';const KEY='knowledge-hub-v1';const $=id=>document.getElementById(id);let records=[],selected=null;function uid(){return 'k'+Date.now().toString(36)+Math.random().toString(36).slice(2,10)}function load(){try{const v=JSON.parse(localStorage.getItem(KEY)||'[]');records=Array.isArray(v)?v:[]}catch(e){records=[];alert('保存データの読み込みに失敗しました')}}function save(){try{localStorage.setItem(KEY,JSON.stringify(records))}catch(e){alert('保存に失敗しました。ストレージの空き容量や設定を確認してください')}}function now(){return new Date().toISOString()}function current(){return records.find(x=>x.id===selected)}function closeSide(){$('side').classList.remove('open')}function goHome(){selected=null;render();closeSide()}function toast(t){let n=$('toast');if(!n){n=el('div',undefined,'toast');n.id='toast';document.body.append(n)}n.textContent=t;n.hidden=false;setTimeout(()=>{n.hidden=true},3200)}function notionText(r,kind){const draft=r.draft;const body=kind==='draft'&&draft?draft.summary:(r.type==='chat'?(r.messages||[]).map(m=>m.text).join('\n\n'):r.body||'');const title=kind==='draft'&&draft?draft.title:r.title;const kw=kind==='draft'&&draft?draft.keywords:'';return ['# '+title,'',body,kw?'\nキーワード: '+kw:'','','出典: Knowledge Hub / '+(r.type==='chat'?'会話':'メモ'),'作成日: '+new Date(r.created).toLocaleString('ja-JP')].filter((x,i)=>x!==''||i===1).join('\n')}async function copyText(text){try{await navigator.clipboard.writeText(text);toast('コピーしました。Notionで貼り付けてください')}catch(e){const a=document.createElement('textarea');a.value=text;a.style.position='fixed';a.style.opacity='0';document.body.append(a);a.select();const ok=document.execCommand('copy');a.remove();if(ok)toast('コピーしました。Notionで貼り付けてください');else{prompt('この文章をコピーしてください',text)}}}function notionPanel(r){const p=el('div',undefined,'notionbox');p.append(el('strong','Notionに渡す'));p.append(el('p','① コピー → ② Notionを開く → ③ 新規ページに貼り付け。自動登録ではありません。','notice'));const row=el('div',undefined,'row');const raw=el('button','会話・メモをコピー','btn');raw.onclick=()=>copyText(notionText(r,'raw'));row.append(raw);if(r.draft){const organized=el('button','整理案をコピー','btn primary');organized.onclick=()=>copyText(notionText(r,'draft'));row.append(organized)}p.append(row);const links=el('div',undefined,'row');[['📔 ナレッジ用','https://www.notion.so/32fec733c98a802a8e60f870dae34805'],['MB ナレッジDB','https://www.notion.so/32cec733c98a8082849de8c3486acd03']].forEach(([label,url])=>{const a=el('a',label+' ↗');a.href=url;a.target='_blank';a.rel='noopener noreferrer';links.append(a)});p.append(links);p.append(el('p','※Notion側で登録完了するまでは、このアプリの状態は変更されません。','notice'));return p}function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}function create(type){const r={id:uid(),type,title:type==='chat'?'新しい会話':'新しいメモ',created:now(),updated:now(),status:'未整理',messages:[],body:'',draft:null};records.unshift(r);selected=r.id;save();render();closeSide();if(type==='chat')$('message').focus();else $('memoBody')?.focus()}function renderList(){const q=$('search').value.toLowerCase(),f=$('filter').value;const wrap=$('items');wrap.replaceChildren();records.filter(r=>(f==='all'||f===r.type||(f==='candidate'&&r.status==='登録候補'))&&[r.title,r.body,...(r.messages||[]).map(m=>m.text)].join(' ').toLowerCase().includes(q)).sort((a,b)=>b.updated.localeCompare(a.updated)).forEach(r=>{const b=el('button',undefined,'item'+(r.id===selected?' active':''));const t=el('strong',r.type==='chat'?'💬 '+r.title:'📝 '+r.title);b.append(t,el('small',r.status+' · '+new Date(r.updated).toLocaleString('ja-JP')));b.onclick=()=>{selected=r.id;render();closeSide()};wrap.append(b)})}function render(){renderList();const r=current(),content=$('content');content.replaceChildren();$('footer').hidden=!r||r.type!=='chat';$('title').disabled=!r;$('remove').disabled=!r;if(!r){$('title').value='';$('status').textContent='未選択';const d=el('div',undefined,'empty');d.append(el('h1','思いつきを残そう'),el('p','会話やメモを作成して一時保管できます。','muted'));const b=el('button','＋ 会話を作る','btn primary');b.onclick=()=>create('chat');d.append(b);content.append(d);return}$('title').value=r.title;$('status').textContent=r.status;const tools=el('div',undefined,'row');const organize=el('button','✦ 整理案を作る','btn');organize.onclick=()=>{r.draft=makeDraft(r);r.status='整理済み';r.updated=now();save();render()};tools.append(organize);if(r.draft){const jump=el('button','整理案を編集','btn');jump.onclick=()=>{$('draftTitle')?.focus()};tools.append(jump)}content.append(tools);content.append(notionPanel(r));if(r.type==='chat'){const list=el('div',undefined,'messages');if(!r.messages.length)list.append(el('p','ここに入力した発言が順番に保存されます。AIからの返答はまだありません。','muted'));r.messages.forEach(m=>{const b=el('div',undefined,'bubble me');b.append(el('div',m.text),el('div',new Date(m.time).toLocaleString('ja-JP'),'stamp'));list.append(b)});content.append(list)}else{const p=el('div',undefined,'panel');p.append(el('h3','クイックメモ'));const a=el('textarea');a.id='memoBody';a.placeholder='思いつきを書き留めよう。入力すると自動保存されます。';a.style.minHeight='220px';a.value=r.body||'';a.oninput=()=>{r.body=a.value;r.updated=now();save();renderList()};p.append(a);content.append(p)}if(r.draft){const p=el('div',undefined,'panel draft');p.append(el('h3','AI整理の下書き（簡易版）'));const fields=[['タイトル','title'],['要約・内容','summary'],['キーワード','keywords']];fields.forEach(([label,key])=>{const l=el('label',label);const input=key==='summary'?el('textarea'):el('input');input.id='draft'+key[0].toUpperCase()+key.slice(1);input.value=r.draft[key]||'';input.oninput=()=>{r.draft[key]=input.value;r.updated=now();save()};p.append(l,input)});p.append(el('p','この整理案は文字列からの簡易生成です。AIによる分析ではありません。','notice'));const b=el('button',r.status==='登録候補'?'登録候補として保存済み':'登録候補として保管','btn primary');b.onclick=()=>{r.status='登録候補';r.updated=now();save();render()};p.append(b);content.append(p)}content.scrollTop=content.scrollHeight}function makeDraft(r){const s=r.type==='chat'?(r.messages||[]).map(m=>m.text).join('\n'):r.body||'';const lines=s.split(/\n/).map(x=>x.trim()).filter(Boolean);return {title:r.title==='新しい会話'||r.title==='新しいメモ'?(lines[0]||r.title).slice(0,50):r.title,summary:s.slice(0,4000),keywords:''}}function send(){const r=current();if(!r||r.type!=='chat')return;const text=$('message').value.trim();if(!text)return;r.messages.push({id:uid(),text,time:now()});if(r.title==='新しい会話')r.title=text.slice(0,30);r.updated=now();$('message').value='';save();render();$('message').focus()}$('newChat').onclick=$('startChat').onclick=()=>create('chat');$('newMemo').onclick=$('startMemo').onclick=()=>create('memo');$('send').onclick=send;$('message').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();send()}});$('title').oninput=e=>{const r=current();if(!r)return;r.title=e.target.value;r.updated=now();save();renderList()};$('search').oninput=renderList;$('filter').onchange=renderList;$('menu').onclick=()=>$('side').classList.toggle('open');$('home').onclick=goHome;$('sideHome').onclick=goHome;$('remove').onclick=()=>{const r=current();if(!r||!confirm('「'+r.title+'」を削除しますか？'))return;records=records.filter(x=>x.id!==selected);selected=null;save();render()};$('export').onclick=()=>{const blob=new Blob([JSON.stringify(records,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='knowledge-hub-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!Array.isArray(data)||!data.every(x=>x&&typeof x.id==='string'&&['chat','memo'].includes(x.type)))throw Error('形式が違います');if(!confirm('現在のデータを読み込んだバックアップで置き換えますか？'))return;records=data;selected=null;save();render()}catch(err){alert('読み込みに失敗しました: '+err.message)}finally{e.target.value=''}};load();render();if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script></body></html>
